name: db6112-setting-collation
x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-db6112-setting-collation}-app:local
  env_file: [.env]
  environment:
    DATABASE_URL: "mysql+pymysql://workbench:${DB_PASSWORD:-WorkbenchLocal23}@db:3306/workbench"
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-local-demo-replace-with-a-random-secret-20261124}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-DbWorkbench-2026}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes:
    - evidence:/var/lib/workbench
services:
  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-db6112-setting-collation}-frontend
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-18313}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 2s
      timeout: 4s
      retries: 24
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-db6112-setting-collation}-backend
    build: ./backend
    ports: ["127.0.0.1:${BACKEND_PORT:-19313}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 4s
      retries: 45
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-db6112-setting-collation}-worker
    command: ["python", "-m", "src.worker"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from src.worker import check; raise SystemExit(0 if check() else 1)"]
      interval: 2s
      timeout: 4s
      retries: 25
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-db6112-setting-collation}-db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: workbench
      MYSQL_USER: workbench
      MYSQL_PASSWORD: ${DB_PASSWORD:-WorkbenchLocal23}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-WorkbenchLocal23}
    ports: ["127.0.0.1:${DB_PORT:-17813}:3306"]
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u workbench -D workbench -Nse "select 1"']
      interval: 2s
      timeout: 4s
      retries: 60
  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-db6112-setting-collation}-redis
    image: redis:7-alpine
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 25
volumes:
  database:
  redis:
  evidence:
